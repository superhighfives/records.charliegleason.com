name: Records
options:
  bundleIdPrefix: com.superhighfives
settings:
  base:
    DEVELOPMENT_TEAM: TGHU37N6EX
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
targets:
  Records:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Records
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.superhighfives.Records
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    info:
      path: Records/Info.plist
      properties:
        NSHumanReadableCopyright: ""
        NSAppleMusicUsageDescription: "Records needs Apple Music access to play the album currently showing on your record display."
        NSLocalNetworkUsageDescription: "Records listens on your local network for updates from your record display board."
        NSBonjourServices:
          - _recplay._tcp
        LSApplicationCategoryType: public.app-category.music
