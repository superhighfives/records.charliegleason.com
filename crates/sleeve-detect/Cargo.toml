[package]
name = "sleeve-detect"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = { version = "0.1.7", optional = true }
image = { version = "0.25.10", default-features = false, features = [] }
imageproc = { version = "0.27.0", default-features = false }
wasm-bindgen = "0.2.127"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

# Native-only codecs for the offline tuning harness (examples/tune.rs). Kept out of the
# [dependencies] table so they never enter the wasm build — the shipped `cdylib` still
# only ever consumes an already-decoded RGBA buffer (see lib.rs `detect_sleeve_corners`).
[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["webp", "png"] }

[features]
console_error_panic_hook = ["dep:console_error_panic_hook"]
# Exposes the segmentation's intermediate stages (background estimate, threshold, mask,
# blob area, rectangularity) for the offline harness. Never enabled for the wasm build.
debug-harness = []

[[example]]
name = "tune"
required-features = ["debug-harness"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
