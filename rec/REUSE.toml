version = 1
SPDX-PackageName = "rec"
SPDX-PackageDownloadLocation = "NOASSERTION"

# These documents use this exact annotation instead of reader-visible headers.
[[annotations]]
path = [
  "README.md",
  "INSTALL.md",
  "CLAUDE.md",
  "docs/TROUBLESHOOTING.md",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Mark Phelps"
SPDX-License-Identifier = "Apache-2.0"

# Written by the ESP-IDF component manager. Regenerated on every dependency
# change, so a hand-written header would not survive.
[[annotations]]
path = "firmware/dependencies.lock"
precedence = "override"
SPDX-FileCopyrightText = "2026 Mark Phelps"
SPDX-License-Identifier = "Apache-2.0"
