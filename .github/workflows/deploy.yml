name: Deploy

# Build + deploy from CI so the *production* build-time vars (Clerk pk_live,
# Sentry) are baked in. Building locally would inline whatever is in your
# .env.local — which is intentionally test keys — and ship "Development mode".
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Apply pending D1 migrations FIRST, in a job of its own that is NEVER cancelled
  # (`cancel-in-progress: false`) — a migration must not be interrupted mid-run. Two
  # pushes in quick succession queue here rather than cancelling an in-flight
  # `migrations apply`, which (were it in the deploy job's cancellable group) could
  # otherwise land a schema change without recording it in `d1_migrations` and wedge
  # the next run on a "duplicate column". Idempotent: only runs migrations missing
  # from the DB's `d1_migrations` table, so it's a no-op once production is current.
  # Same mechanism + secrets the preview workflows already use for `records-preview`.
  #
  # Migrate-then-deploy ordering: an *additive* migration the new build depends on
  # (ADD COLUMN) is in place the moment it flips live. The cost — a *destructive*
  # migration (DROP COLUMN / rename) must NOT ship in the same release as the code
  # that stops using the column (the still-live old build would break); drop such
  # columns in a SEPARATE, later PR (expand/contract).
  migrate:
    runs-on: ubuntu-latest
    concurrency:
      group: d1-migrate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Apply D1 migrations
        run: bunx wrangler d1 migrations apply records --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Build + deploy only after migrations succeed. Stays cancellable — a newer commit
  # abandons an in-flight build/deploy (the original one-deploy-at-a-time behaviour),
  # which is safe for a build/deploy in a way it is not for a migration.
  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # `bun run deploy` = vite build && wrangler deploy.
      # VITE_* + SENTRY_AUTH_TOKEN are build-time (inlined / source-map upload).
      # CLOUDFLARE_* authenticate wrangler deploy.
      # Runtime secrets (CLERK_SECRET_KEY, DISCOGS_TOKEN, LASTFM_API_KEY,
      # CRON_SECRET) live on the Worker via `wrangler secret put` — not needed here.
      - run: bun run deploy
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ORG: ${{ secrets.VITE_SENTRY_ORG }}
          VITE_SENTRY_PROJECT: ${{ secrets.VITE_SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
