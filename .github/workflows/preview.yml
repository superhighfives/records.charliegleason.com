name: Preview

# Per-PR preview of the app. Each PR is uploaded as a *version* of the shared
# `records-preview` Worker and gets its own stable Cloudflare preview URL
# (https://pr-<number>-records-preview.<subdomain>.workers.dev) via
# `wrangler versions upload --preview-alias`. Because `versions upload` only
# mints the workers.dev preview URL and never changes the version served on a
# route, PRs no longer evict each other — each keeps its own live URL.
#
# Worker versions share the parent Worker's bindings, so every preview reads the
# one isolated `records-preview` D1 — a snapshot of production refreshed nightly
# by preview-db-refresh.yml, never the live production database. Captures made
# while reviewing stay in that shared preview DB. R2 (cover photos) is shared
# with production. Any migrations a PR adds are applied to the preview DB so
# schema-changing PRs still work. See SETUP.md → "PR previews".
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# Cancel superseded builds for the SAME PR only — different PRs keep their own
# preview URL and no longer cancel each other.
concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    # Skip forks — they don't have access to the repo/account secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Same build-time vars as Deploy, except Clerk: previews use a Clerk
      # *development* instance, which works on any origin (incl. *.workers.dev).
      # A production instance would need the preview URL as a satellite domain
      # with DNS you can't add to workers.dev. Set VITE_CLERK_PUBLISHABLE_KEY_PREVIEW
      # (pk_test_…) in repo secrets, and the preview Worker's CLERK_SECRET_KEY to the
      # matching sk_test_… (wrangler secret put CLERK_SECRET_KEY --env preview).
      #
      # CLOUDFLARE_ENV selects the wrangler environment at BUILD time — the
      # @cloudflare/vite-plugin bakes it into the generated deploy config. Without
      # it the build defaults to the top-level (production!) config and a later
      # `wrangler versions upload` can't override it.
      - name: Build
        run: bun run build
        env:
          CLOUDFLARE_ENV: preview
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY_PREVIEW }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ORG: ${{ secrets.VITE_SENTRY_ORG }}
          VITE_SENTRY_PROJECT: ${{ secrets.VITE_SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      # Top up the shared preview DB with any migrations this PR adds, so
      # schema-changing PRs render. Idempotent: `migrations apply` runs only the
      # migrations missing from the preview DB's d1_migrations table (a no-op for
      # non-schema PRs). The full production clone happens nightly
      # (preview-db-refresh.yml); this never touches production D1.
      - name: Apply PR migrations to preview database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler d1 migrations apply records-preview --remote --env preview

      # Upload this PR's build as a new version of the preview Worker and give it
      # a stable per-PR alias URL. `versions upload` does NOT promote the version
      # to any route, so previews never overwrite each other. CLOUDFLARE_ENV keeps
      # wrangler aligned with the preview build output the vite plugin generated.
      - name: Upload preview version
        id: upload
        env:
          CLOUDFLARE_ENV: preview
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          bunx wrangler versions upload \
            --preview-alias "pr-${{ github.event.pull_request.number }}" \
            2>&1 | tee /tmp/upload.log
          # `|| true` so a no-match grep doesn't trip `set -e` before the
          # explicit check below can print a useful message.
          url=$(grep -oiE 'https://pr-[0-9a-z.-]+\.workers\.dev' /tmp/upload.log | head -1 || true)
          if [ -z "$url" ]; then
            echo "The version uploaded but no preview URL was minted." >&2
            echo "Enable version preview URLs for the records-preview Worker:" >&2
            echo "claim a workers.dev subdomain on the account and turn Preview" >&2
            echo "URLs on once (a dashboard toggle / one 'wrangler versions" >&2
            echo "deploy' — versions upload can't flip this non-versioned" >&2
            echo "setting). See SETUP.md -> PR previews." >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Also promote this build to the preview Worker's ACTIVE deployment. The
      # per-PR alias URL above only serves HTTP requests; queue consumers (and
      # crons) always run whatever version is *deployed*, never a preview alias. So
      # without this, queued work — notably the professional-photo background matte
      # — would run stale code on every preview. Deploying here points the shared
      # preview consumer at THIS PR's code.
      #
      # Trade-off (accepted): whichever PR built most recently owns the shared
      # preview queue consumer until the next build supersedes it. Fine for a
      # preview env. Safe because `env.preview` pins `routes: []`, so this never
      # serves on a production domain, and preview crons are empty.
      - name: Deploy preview Worker (so the queue consumer runs this PR)
        env:
          CLOUDFLARE_ENV: preview
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy --env preview

      - name: Comment preview URL on the PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const marker = "<!-- records-preview -->";
            const body = `${marker}
            ### 🔎 Preview deployed

            **${url}**

            Per-PR version of the \`records-preview\` Worker. Reads the shared,
            isolated preview database (a nightly snapshot of production with this
            PR's migrations applied) and the shared production R2 bucket. Captures
            made here won't touch production data.

            _Updated for ${context.sha.slice(0, 7)}._`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }
