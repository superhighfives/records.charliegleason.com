name: Preview

# Per-PR preview deploy. Each PR gets its OWN ephemeral Worker
# (`records-pr-<n>`) via a plain `wrangler deploy` against a rewritten config —
# not `wrangler versions upload` against one shared preview Worker. The old
# shared-Worker model needed a single `records-preview` D1 that every PR mutated,
# which drifted whenever two PRs (or a rebuilt migration) touched the same schema
# object. A standalone per-PR Worker sidesteps that whole class of problem.
#
# Shared vs isolated (mirrors the sibling repos' preview model):
#   • D1 + R2 are SHARED with PRODUCTION. Consequence: this job does NOT run D1
#     migrations, so a PR that adds a migration will hit runtime errors on its
#     preview until it merges and the prod deploy applies the migration (the PR
#     comment warns about this). It also means captures/edits made while
#     reviewing a preview write to your REAL collection — previews are for
#     eyeballing behaviour, not throwaway data.
#   • Each PR gets its OWN analyze Queue (`records-analyze-pr-<n>`), so its Worker
#     registers a consumer without fighting production's single consumer — the
#     background analysis pipeline works on the preview.
#   • The matte CONTAINER + its Durable Object are DROPPED in preview (building a
#     Docker image per PR is slow/expensive, and `deploy` would try to). With no
#     MATTE_CONTAINER binding the Apply pipeline falls back to the in-Worker matte
#     render (see renderAiMatte / renderDeterministicMatte) — same as the old
#     preview did.
#   • Cron (weekly digest), custom routes, and email are dropped — preview serves
#     only on its workers.dev URL and sends no mail.
#   • Secrets are set per-PR from repo secrets (below), test-mode where it matters.
#
# The Worker + its Queue are torn down when the PR closes (cleanup job).
#
# Required repo secrets (add these — they used to live only on the prod Worker):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID  — as in deploy.yml, plus
#                                                  Queues:Edit + Workers Scripts:Edit
#   VITE_CLERK_PUBLISHABLE_KEY_PREVIEW           — Clerk pk_test_… (client, dev instance)
#   PREVIEW_CLERK_SECRET_KEY                     — Clerk sk_test_… (server, dev instance)
#   DISCOGS_TOKEN, LASTFM_API_KEY                — reuse the prod values (read-only lookups)
#   REPLICATE_API_KEY                            — Apply pipeline (ESRGAN enhance + AI matte);
#                                                  reuse prod, or a low-cap token for preview
#   VITE_SENTRY_DSN / VITE_SENTRY_ORG / VITE_SENTRY_PROJECT / SENTRY_AUTH_TOKEN
#   Optional (skipped if unset): SERPAPI_KEY, CRON_SECRET, DISCOGS_PROXY_URL,
#                                 DISCOGS_PROXY_SECRET — Fly.io Discogs proxy
#                                 (fly/discogs-proxy); omitted, discogsFetch just
#                                 calls api.discogs.com directly like before
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

# A PR with rapid pushes only needs the latest preview — cancel older runs for
# the SAME PR. Different PRs keep their own Worker and never cancel each other.
concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    # Skip forks (no secret access) and the close event (that's cleanup's job).
    if: >-
      github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Per-PR analyze Queue so this PR's Worker registers its own consumer
      # instead of colliding with production's. Idempotent — a re-run on an
      # existing queue ("already taken") is a no-op; anything else (auth,
      # rate limit, quota) fails the job instead of silently deploying a
      # preview whose Worker has no queue to bind to.
      - name: Ensure per-PR queue exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          output=$(bunx wrangler queues create records-analyze-pr-${PR} 2>&1)
          status=$?
          echo "$output"
          if [ $status -ne 0 ] && ! echo "$output" | grep -qi "already taken"; then
            echo "::error::Failed to create the per-PR analyze queue for an unexpected reason (see output above)."
            exit 1
          fi

      # Rewrite wrangler.jsonc in place (ephemeral CI checkout, never committed):
      # unique Worker name, per-PR queue, prod D1/R2 kept, and everything a per-PR
      # ephemeral Worker shouldn't carry (routes, container/DO, cron, email)
      # stripped. The build (below) reads this rewritten config via the vite plugin.
      - name: Rewrite wrangler config for preview
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pr = context.payload.pull_request.number;
            const path = 'wrangler.jsonc';
            const raw = fs.readFileSync(path, 'utf8');
            // Strip // comments and trailing commas so JSON.parse accepts JSONC.
            const stripped = raw
              .replace(/^\s*\/\/.*$/gm, '')
              .replace(/,\s*([}\]])/g, '$1');
            const config = JSON.parse(stripped);

            config.name = `records-pr-${pr}`;
            // Serve on the workers.dev URL only. Dropping routes is critical —
            // otherwise this per-PR Worker would try to claim the production custom
            // domain (records.charliegleason.com).
            delete config.routes;
            config.workers_dev = true;
            // Mark it the preview env so runtime Sentry stays disabled (src/server.ts).
            config.vars = { ENVIRONMENT: 'preview' };

            // Per-PR queue name for both producer + consumer; drop the DLQ (a
            // second per-PR queue to manage for no preview value).
            const q = `records-analyze-pr-${pr}`;
            if (config.queues?.producers) {
              config.queues.producers = config.queues.producers.map((p) => ({ ...p, queue: q }));
            }
            if (config.queues?.consumers) {
              config.queues.consumers = config.queues.consumers.map(
                ({ dead_letter_queue, ...c }) => ({ ...c, queue: q })
              );
            }

            // Drop the matte container + its DO — preview falls back to the
            // in-Worker matte. `migrations: []` (empty, not removed) mirrors the
            // old env.preview, which proved a `wrangler deploy` succeeds with the
            // MatteContainer class exported but unbound + no DO migration. Also drop
            // the weekly cron and email; a preview serves HTTP only.
            delete config.containers;
            delete config.durable_objects;
            config.migrations = [];
            delete config.triggers;
            delete config.send_email;
            // The named preview env is obsolete under this model.
            delete config.env;

            fs.writeFileSync(path, JSON.stringify(config, null, 2));

      # Build against the rewritten top-level config (no CLOUDFLARE_ENV — that
      # selected the now-removed env.preview block). Preview uses a Clerk *dev*
      # instance (pk_test_/sk_test_), which works on any origin incl. workers.dev.
      - name: Build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY_PREVIEW }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ORG: ${{ secrets.VITE_SENTRY_ORG }}
          VITE_SENTRY_PROJECT: ${{ secrets.VITE_SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: bun run build

      - name: Deploy preview Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          bunx wrangler deploy 2>&1 | tee /tmp/deploy.log
          # `|| true` so a no-match grep doesn't trip `set -e` before the check.
          url=$(grep -oiE "https://records-pr-${PR}\.[a-z0-9-]+\.workers\.dev" /tmp/deploy.log | head -1 || true)
          if [ -z "$url" ]; then
            echo "Deploy succeeded but no workers.dev URL was found in the output." >&2
            echo "Confirm a workers.dev subdomain is claimed on the account." >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Set the per-PR Worker's runtime secrets. `secret bulk` targets the Worker
      # named in the rewritten wrangler.jsonc. Empty/unset values are dropped, so
      # optional integrations can be left unconfigured.
      - name: Push preview secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLERK_SECRET_KEY: ${{ secrets.PREVIEW_CLERK_SECRET_KEY }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          # Apply pipeline (ESRGAN enhance + AI matte) calls Replicate directly —
          # needed even in preview, where the matte container is dropped and the
          # in-Worker matte/enhance run instead.
          REPLICATE_API_KEY: ${{ secrets.REPLICATE_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DISCOGS_PROXY_URL: ${{ secrets.DISCOGS_PROXY_URL }}
          DISCOGS_PROXY_SECRET: ${{ secrets.DISCOGS_PROXY_SECRET }}
        run: |
          node -e '
            const keys = [
              "CLERK_SECRET_KEY", "DISCOGS_TOKEN", "LASTFM_API_KEY",
              "REPLICATE_API_KEY", "SERPAPI_KEY", "CRON_SECRET",
              "DISCOGS_PROXY_URL", "DISCOGS_PROXY_SECRET",
            ];
            const out = {};
            for (const k of keys) {
              const v = process.env[k];
              if (v !== undefined && v !== "") out[k] = v;
            }
            process.stdout.write(JSON.stringify(out));
          ' | bunx wrangler secret bulk

      - name: Comment preview URL on the PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const marker = "<!-- records-preview -->";
            const body = `${marker}
            ### 🔎 Preview deployed

            **${url}**

            Ephemeral per-PR Worker (\`records-pr-${context.payload.pull_request.number}\`) on a Clerk **dev** instance. Shares production **D1 / R2**, so captures and edits you make here write to your **real** collection. Torn down when this PR closes.

            > ⚠️ D1 migrations are *not* applied to previews — a PR that adds a migration will error here until it merges.

            _Updated for ${context.sha.slice(0, 7)}._`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # On PR close (merged or not), tear down the per-PR resources. Order matters and
  # `wrangler delete --force` does NOT release the queue consumer on its own
  # (fails with code 10064), so we explicitly remove the consumer first, then the
  # Worker, then the (now-unreferenced) Queue.
  #
  # "does not exist" from any step is expected and benign — the PR may have
  # closed before the deploy job ever ran, or a previous run of this same job
  # already cleaned it up. Anything else is a real failure and fails the job
  # so it's visible, rather than the old blanket continue-on-error that let
  # ~100 orphaned Workers/Queues pile up unnoticed before this fix (see
  # nylon-impossible's plans/done/2026-08-07-clean-up-orphaned-preview-resources.md
  # for the incident that surfaced this pattern across all three repos).
  cleanup:
    if: >-
      github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Clean up preview resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          failed=0

          run_step() {
            local desc="$1"; shift
            echo "::group::$desc"
            output=$("$@" 2>&1)
            status=$?
            echo "$output"
            echo "::endgroup::"
            if [ $status -ne 0 ]; then
              if echo "$output" | grep -qi "does not exist"; then
                echo "$desc: already gone, ok"
              else
                echo "::error::$desc failed unexpectedly"
                failed=1
              fi
            fi
          }

          # Release the consumer link first — `wrangler delete` won't (code 10064).
          run_step "Remove queue consumer" \
            bunx wrangler queues consumer remove "records-analyze-pr-${PR}" "records-pr-${PR}"

          run_step "Delete preview Worker" \
            bunx wrangler delete --name "records-pr-${PR}" --force

          run_step "Delete preview queue" \
            bunx wrangler queues delete "records-analyze-pr-${PR}"

          exit $failed
